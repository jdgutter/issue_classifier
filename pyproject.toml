[project]
name = "gemini-ml-service"
version = "0.1.0"
description = "Building an ML service with Gemini"
authors = [
    {name = "Justin Gutter",email = "jgutter7@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "scikit-learn (>=1.8.0,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.47.0,<0.48.0)",
    "mlflow (>=3.13.0,<4.0.0)",
    "sentence-transformers (>=5.6.0,<6.0.0)",
    "faiss-cpu (>=1.14.3,<2.0.0)",
]

[tool.poetry]
packages = [
    { include = "src" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "ruff (>=0.15.14,<0.16.0)",
    "httpx (>=0.27.0,<0.28.0)"
]
